<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT56 - Home</title>
    <style>
        /* Global Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Light yellow background */
            background-color: #FEF9E7; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2C3E50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Container with Sharp, Modern Styling */
        .container {
            text-align: center;
            background: #ffffff;
            padding: 50px 70px;
            border: 2px solid #2C3E50; /* Sharp border look */
            box-shadow: 8px 8px 0px #2C3E50; /* Bold sharp offset shadow */
            max-width: 600px;
            width: 90%;
        }

        /* Page Title Styling */
        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #1A252F;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 4px solid #F1C40F; /* Accent underline */
            display: inline-block;
            padding-bottom: 10px;
        }

        /* Subtitle/Description Styling */
        p {
            font-size: 1.1rem;
            color: #555555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Sharp Styled Button */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #F1C40F;
            color: #1A252F;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid #1A252F;
            box-shadow: 8px 6px 0px #1A252F;
            transition: all 0.1s ease;
        }

        .btn:hover {
            background-color: #F39C12;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1A252F;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1A252F;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Page Title -->
        <h1>IT56</h1>
        <p>Welcome to your sharp, modern home webpage. Designed with crisp lines and a warm light yellow palette.</p>
        
        <!-- Interactive Element -->
        <a href="#" class="btn">Explore More</a>
    </div>

</body>
</html>
